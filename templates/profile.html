<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile | Smart Plant Care</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8f9fa;
      padding-top: 70px;
    }
    .profile-container {
      max-width: 700px;
      margin: auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 40px;
    }
    .profile-avatar {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-container text-center">
      {% if profile_image_id %}
        <img src="{{ url_for('get_image', image_id=profile_image_id) }}" class="profile-avatar" alt="Profile Image">
      {% else %}
        <div class="profile-avatar bg-success text-white d-flex justify-content-center align-items-center">
          <span style="font-size: 36px;">{{ user_name[0]|upper }}</span>
        </div>
      {% endif %}

      <h3>{{ user_name }}</h3>
      <p class="text-muted">{{ user_email }}</p>

      <form method="POST" action="/profile" enctype="multipart/form-data" class="text-start mt-4">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" name="name" class="form-control" value="{{ user_name }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Upload Profile Photo</label>
          <input type="file" name="profile_image" class="form-control" accept="image/*">
        </div>
        <button type="submit" class="btn btn-success w-100">Save Changes</button>
      </form>
    </div>
  </div>
</body>
</html>
